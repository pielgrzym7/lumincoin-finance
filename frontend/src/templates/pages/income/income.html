<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Доходы</title>
</head>
<body>
<div class="wrapper h-100">
    <section class="dash d-flex flex-row h-100">


        <section class="dashboard">
            <div class="d-flex flex-column flex-shrink-0 bg-white h-100"
                 style="width: 218px; border: 1px solid #D9D9D9; ">

                <div class="d-flex align-items-center mb-md-0 me-md-auto text-white mx-auto"
                     style="padding: 40px 0 20px 0; "><a
                        href="/" class=" text-decoration-none">
                    <img class="img-mb" src="../../../images/logo.png" alt="logo">
                </a>
                </div>

                <hr class="m-0" style="color:var(--bs-primary-text-emphasis);">


                <ul class="nav nav-pills flex-column mb-auto mx-auto" style="padding-top: 60px; ">

                    <li class="nav-item nav-style">
                        <a href="#" class="nav-link " aria-current="page">
                            <i class="fa-regular fa-house"></i>
                            Главная
                        </a>
                    </li>

                    <li class="nav-item nav-style">
                        <a href="#" class="nav-link ">
                            <i class="fa-solid fa-money-check-dollar"></i>
                            Доходы & Расходы
                        </a>
                    </li>


                    <li class=" nav-item nav-style d-flex justify-content-between  ">
                        <a href="#" class="nav-link d-inline-flex align-items-center collapsed "
                           data-bs-toggle="collapse" data-bs-target="#category-collapse" aria-expanded="false">
                            Категории
                            <i class="fa-solid fa-chevron-right " style="margin-left: 65px"></i>
                        </a>
                    </li>

                    <div class="collapse " id="category-collapse">
                        <ul class="btn-toggle-nav list-unstyled fw-normal small">
                            <li class="nav-item nav-style">
                                <a href="#" class="nav-link ">
                                    Доходы
                                </a>
                            </li>
                            <li class="nav-item nav-style">
                                <a href="#" class="nav-link ">
                                    Расходы
                                </a>
                            </li>
                        </ul>
                    </div>
                </ul>

                <div class="cen">

                    <div class="d-flex mx-auto dashboard-balance">
                        <div class="nav-style" style="margin-right: 10px; color: #052C65"> Баланс:</div>
                        <p style="color: #0D6EFD">500 $</p>
                    </div>

                    <hr class="m-0" style="color:#D9D9D9;">


                    <div class="dropup-center dropup d-flex align-items-center mx-auto user-toggle">

                        <div class="btn dropdown-toggle user-toggle-arrow d-flex align-items-center" type="button"
                             data-bs-toggle="dropdown"
                             aria-expanded="false" style="font-size: 14px">
                            <div class="d-flex justify-content-center align-items-center rounded-circle me-3"
                                 style="width: 36px; height: 36px; background-color: #D9D9D9; ">
                                <i class="fa-regular fa-user"
                                   style="color: #6C757D"></i>
                            </div>
                            Roman Chernov
                        </div>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="#">Выйти</a></li>
                        </ul>
                    </div>
                </div>
            </div>
        </section>


        <section class="main d-flex flex-column w-100 income">
            <div class="container-fluid min-vh-100 w-100" style="padding: 100px 94px 133px 60px;">

                <h1 class="income-title m-0" style="padding-bottom: 40px ">
                    Доходы</h1>

                <div class="income-blocks d-flex flex-row flex-wrap fw-medium" style="gap: 20px; row-gap: 20px;">

                    <div class="income-block d-flex flex-column">
                        <div class="income-block-title lh-1">Депозиты
                        </div>
                        <div class="income-block-buttons ">
                            <button role="button" class="border-0 lh-1 btn btn-primary fw-medium "
                                    style="width: 134px; margin-right: 10px">
                                Редактировать
                            </button>
                            <button role="button" class="border-0 lh-1 btn btn-danger fw-medium "
                                    style=" width: 88px;">
                                Удалить
                            </button>
                        </div>
                    </div>

                    <div class="income-block d-flex flex-column">
                        <div class="income-block-title lh-1">Зарплата
                        </div>
                        <div class="income-block-buttons ">
                            <button role="button" class="border-0 lh-1 btn btn-primary fw-medium "
                                    style="width: 134px;  margin-right: 10px">
                                Редактировать
                            </button>
                            <button role="button" class="border-0 lh-1 btn btn-danger fw-medium "
                                    style=" width: 88px;">
                                Удалить
                            </button>
                        </div>
                    </div>

                    <div class="income-block d-flex flex-column">
                        <div class="income-block-title lh-1">Сбережения
                        </div>
                        <div class="income-block-buttons ">
                            <button role="button" class="border-0 lh-1 btn btn-primary fw-medium "
                                    style="width: 134px;  margin-right: 10px">
                                Редактировать
                            </button>
                            <button role="button" class="border-0 lh-1 btn btn-danger fw-medium "
                                    style=" width: 88px;">
                                Удалить
                            </button>
                        </div>
                    </div>

                    <div class="income-block d-flex flex-column">
                        <div class="income-block-title lh-1">Инвестиции
                        </div>
                        <div class="income-block-buttons ">
                            <button role="button" class="border-0 lh-1 btn btn-primary fw-medium "
                                    style="width: 134px; margin-right: 10px">
                                Редактировать
                            </button>
                            <button role="button" class="border-0 lh-1 btn btn-danger fw-medium "
                                    style=" width: 88px;">
                                Удалить
                            </button>
                        </div>
                    </div>

                    <div class="income-block d-flex">
                        <div class="income-block-buttons align-content-center m-auto">
                            <button role="button" class="border-0 " style="background: none; color: #CED4DA"><i
                                    class="fa-solid fa-plus"></i></button>
                        </div>
                    </div>
                </div>
                <button type="button" class="btn btn-warning" data-bs-toggle="modal" data-bs-target="#staticBackdrop"
                        style="margin-top: 80px;">
                    Попап для кнопки удалить
                </button>

            </div>

            <!-- Modal -->
            <div class="modal fade fw-medium" id="staticBackdrop" data-bs-backdrop="static" data-bs-keyboard="false"
                 tabindex="-1"
                 aria-labelledby="staticBackdropLabel" aria-hidden="true">
                <div class="modal-dialog modal-dialog-centered">
                    <div class="modal-dialog">
                        <div class="modal-content"
                             style="width: 530px; height: 184px; background: #FFFFFF; border: 1px solid #CED4DA; border-radius: 12px; padding: 40px">
                            <div class="modal-body p-0"
                                 style=" font-size: 20px; line-height: 23px; text-align: center; color: #290661; margin-bottom: 20px ">
                                Вы действительно хотите удалить категорию? Связанные доходы останутся без категории.
                            </div>
                            <div class="modal-footer border-0 p-0 m-auto d-flex" style="gap: 12px">
                                <button type="button" class="btn btn-success m-0 lh-1 text-white "
                                        data-bs-dismiss="modal"
                                        style=" padding: 12px 16px; width: 111px; height: 38px;  border-radius: 5px; font-size: 14px">
                                    Да, удалить
                                </button>
                                <button type="button" class="btn btn-danger m-0 lh-1 text-white "
                                        data-bs-dismiss="modal"
                                        style=" padding: 12px 16px; width: 107px; height: 38px; border-radius: 5px; font-size: 14px">
                                    Не удалять
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </section>
</div>
</div>

</body>
</html>
